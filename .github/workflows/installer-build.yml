name: Build Noctua installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'installer/**'
      - '.github/workflows/build-installer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish the installer as one exe
        run: dotnet publish installer/NoctuaSetup.csproj -c Release -o dist-setup

      - name: Keep it as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoctuaSetup
          path: dist-setup/NoctuaSetup.exe

      - name: Publish it as the "installer-latest" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete installer-latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create installer-latest dist-setup/NoctuaSetup.exe --title "Noctua installer" --notes "Per-user installer. Downloads the newest Noctua from the wpf-latest release, adds Start menu and desktop shortcuts, and registers an uninstaller. No administrator rights needed."
