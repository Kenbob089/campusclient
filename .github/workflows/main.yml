name: Build Campus-Midnight.exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with the C# compiler built into Windows
        shell: cmd
        run: |
          if not exist dist mkdir dist
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /debug- /warn:1 /out:dist\Campus-Midnight.exe /win32manifest:app.manifest /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:System.Security.dll src\*.cs

      - name: Keep the exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Midnight
          path: dist/Campus-Midnight.exe

      - name: Publish it as the "latest" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest dist/Campus-Midnight.exe --title "Campus Midnight (latest build)" --notes "Portable Windows app. Download Campus-Midnight.exe and double-click it."
