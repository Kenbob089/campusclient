
name: Delete Selected Files

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to confirm"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    if: inputs.confirm == 'DELETE'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete selected items
        run: |
          rm -rf -- .github/workflows src
          rm -f -- README.txt app.manifest build.bat

      - name: Commit deletions
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Delete selected files and folders"
            git push
          else
            echo "Nothing to delete."
          fi
