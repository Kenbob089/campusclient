
name: Delete Selected Files

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to confirm'
        required: true
        type: string

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm deletion
        if: ${{ inputs.confirm != 'DELETE' }}
        run: |
          echo "Confirmation failed."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete selected files and folders
        run: |
          rm -rf \
            src/ \
            README.txt \
            app.manifest \
            build.bat \
            wrangler.jsonc \
            wpf/ \
            app.ico

      - name: Commit deletions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Delete selected files and folders"
          git push
